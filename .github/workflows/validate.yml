name: Validate SQL analytics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild deterministic reports
        run: python run.py
      - name: Test SQL correctness
        run: python -m unittest discover -s tests -v
      - name: Verify committed reports reproduce exactly
        run: git diff --exit-code -- reports
